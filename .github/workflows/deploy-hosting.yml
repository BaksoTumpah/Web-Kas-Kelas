name: Deploy Firebase Hosting

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '404.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icon-*.png'
      - 'firebase.json'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KAS_KELAS_SMANSA }}
          channelId: live
          projectId: kas-kelas-smansa
